<title>경력기술서</title>

<style id="lockcss">
  :root{--bg:#F3F5F7;--card:#fff;--ink:#111419;--muted:#59616F;--faint:#8A929E;--rule:#D5DAE1;--accent:#2C4C7C;--err:#B3261E}
  @media (prefers-color-scheme:dark){:root{--bg:#0E1116;--card:#151920;--ink:#E9ECF1;--muted:#949DAB;--faint:#6B7583;--rule:#292F39;--accent:#86A8DC;--err:#F2B8B5}}
  html{color-scheme:light dark}
  body{margin:0;background:var(--bg);color:var(--ink);font-family:'IBM Plex Sans KR','Malgun Gothic',system-ui,sans-serif;
       min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px;box-sizing:border-box}
  .lock{background:var(--card);border:1px solid var(--rule);border-radius:4px;padding:34px 32px 28px;width:100%;max-width:380px}
  .lock h1{font-size:17px;font-weight:500;margin:0 0 4px}
  .lock p{margin:0 0 20px;font-size:13px;color:var(--muted);line-height:1.6}
  .lock form{display:flex;gap:8px}
  .lock input{flex:1;font:inherit;font-size:15px;padding:10px 12px;border:1px solid var(--rule);border-radius:3px;background:transparent;color:var(--ink)}
  .lock input:focus{outline:2px solid var(--accent);outline-offset:1px;border-color:transparent}
  .lock button{font:inherit;font-size:14px;padding:10px 16px;border:0;border-radius:3px;background:var(--accent);color:#fff;cursor:pointer}
  .lock button:disabled{opacity:.6;cursor:wait}
  .msg{margin:12px 0 0;font-size:12.5px;min-height:1.2em;color:var(--err)}
  .tag{margin-top:22px;font-family:'IBM Plex Mono',monospace;font-size:9.5px;letter-spacing:.12em;text-transform:uppercase;color:var(--faint)}
</style>
</head>

<script>
(function(){
  var SALT=Uint8Array.from(atob('7C7srIFWRnNXnuySe7rREA=='),function(c){return c.charCodeAt(0)});
  var SLOTS=["u8/8phtV30WNmnoKKdD1kPXJbltPN2hzxs+hda+r2f1w4QrNtgeX0osJUPa6u+wK8HH6i8qUm4Y5BEcn", "ON+sWZYkLDTGROdQ+QhAsgxdTRmK9MzPByax3lUTnaCqH1ygAB0apthaCqacACEGLxgt/X3U0y8y9szw"], ITER=400000, KEY=null, cache={};
  var $=function(id){return document.getElementById(id)};
  function b64(s){var b=atob(s),u=new Uint8Array(b.length);for(var i=0;i<b.length;i++)u[i]=b.charCodeAt(i);return u}
  async function kek(pw){
    var km=await crypto.subtle.importKey('raw',new TextEncoder().encode(pw),'PBKDF2',false,['deriveKey']);
    return crypto.subtle.deriveKey({name:'PBKDF2',salt:SALT,iterations:ITER,hash:'SHA-256'},km,{name:'AES-GCM',length:256},false,['decrypt']);
  }
  async function dec(key,u8){
    return new Uint8Array(await crypto.subtle.decrypt({name:'AES-GCM',iv:u8.slice(0,12)},key,u8.slice(12)));
  }
  // 비밀번호로 슬롯을 열어 콘텐츠 키를 꺼낸다 (어느 슬롯이든 하나만 맞으면 됨)
  async function unwrap(pw){
    var k=await kek(pw);
    for(var i=0;i<SLOTS.length;i++){
      try{
        var raw=await dec(k,b64(SLOTS[i]));
        return crypto.subtle.importKey('raw',raw,{name:'AES-GCM'},false,['decrypt']);
      }catch(e){}
    }
    throw new Error('no slot');
  }
  window.__dec=async function(url){
    if(cache[url])return cache[url];
    var r=await fetch(url); if(!r.ok)throw new Error(url);
    var pt;
    try{ pt=await dec(KEY,new Uint8Array(await r.arrayBuffer())); }
    catch(e){
      var r2=await fetch(url,{cache:'reload'}); if(!r2.ok)throw e;
      pt=await dec(KEY,new Uint8Array(await r2.arrayBuffer()));
    }
    return cache[url]=URL.createObjectURL(new Blob([pt],{type:'video/mp4'}));
  };
  function mount(html){
    var doc=new DOMParser().parseFromString(html,'text/html');
    document.title=doc.title||document.title;
    var css=$('lockcss'); if(css)css.remove();
    Array.prototype.forEach.call(doc.head.querySelectorAll('style,link[rel="stylesheet"]'),function(n){document.head.appendChild(n)});
    document.body.style.cssText='';document.body.innerHTML='';
    Array.prototype.forEach.call(Array.prototype.slice.call(doc.body.childNodes),function(n){document.body.appendChild(n)});
    Array.prototype.forEach.call(document.body.querySelectorAll('script'),function(s){
      var n=document.createElement('script'); n.textContent=s.textContent; s.parentNode.replaceChild(n,s);
    });
  }
  async function unlock(pw,fromLink){
    var btn=$('go'),msg=$('msg'); btn.disabled=true; msg.style.color='var(--muted)'; msg.textContent='확인 중…';
    try{
      var key=await unwrap(pw);
      var html=new TextDecoder().decode(await dec(key,b64($('payload').textContent.trim())));
      KEY=key;
      if(fromLink){ try{history.replaceState(null,'',location.pathname+location.search)}catch(e){} }
      mount(html);
    }catch(e){
      msg.style.color='var(--err)'; msg.textContent=fromLink?'링크의 비밀번호가 맞지 않습니다. 직접 입력해 주세요.':'비밀번호가 맞지 않습니다.';
      btn.disabled=false; $('pw').select();
    }
  }
  $('f').addEventListener('submit',function(e){e.preventDefault();var v=$('pw').value;if(v)unlock(v,false)});
  var m=/[#&]k=([^&]+)/.exec(location.hash||'');
  if(m){ $('pw').value=decodeURIComponent(m[1]); unlock($('pw').value,true); }
})();
</script>
